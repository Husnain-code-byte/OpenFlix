name: pixel
description: OpenFlix — an open, modular media aggregator (Stremio addon protocol v3).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  equatable: ^2.0.5
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# The OS shows this window while the Flutter engine boots. Black (not the
# default white) makes launch feel instant instead of flashing a white page.
flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
    icon_background_color: "#08121F"

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Bold.ttf
          weight: 700
    - family: Creepster
      fonts:
        - asset: assets/fonts/Creepster-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ic_launcher.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/ic_launcher.png"
